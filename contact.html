<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact & Order | Bobo's Chocolate World</title>

    <link rel="stylesheet" href="Zulaikhastyle.css">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">
        🍫 Bobo's Chocolate World
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="product.html">Product</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<!-- CUSTOMER DETAILS -->
<section class="contact-container" id="order-form">

    <h2>Customer Details ♡</h2>
    <p>Please fill in your details to complete your order.</p>

    <form id="customer-form" onsubmit="submitOrder(event)">

        <label for="customer-name">Customer Name</label>
        <input type="text" id="customer-name"
               placeholder="Enter your name" required>

        <label for="customer-email">Email Address</label>
        <input type="email" id="customer-email"
               placeholder="Enter your email" required>

        <label for="customer-phone">Phone Number</label>
        <input type="tel" id="customer-phone"
               placeholder="Enter your phone number" required>

        <label for="delivery-address">Delivery Address</label>
        <textarea id="delivery-address"
                  placeholder="Enter your address"
                  required></textarea>

        <label for="payment-method">Payment Method</label>
        <select id="payment-method" required>
            <option value="">-- Choose Payment --</option>
            <option value="Online Banking">Online Banking</option>
            <option value="Cash on Delivery">Cash on Delivery</option>
            <option value="E-Wallet">E-Wallet</option>
        </select>

        <label for="customer-message">Message</label>
        <textarea id="customer-message"
                  placeholder="Your message (optional)"></textarea>

        <button type="submit" class="pink-button">
            Submit Customer Details ♡
        </button>

    </form>

</section>
<!-- ORDER CONFIRMATION / RECEIPT -->
<section class="contact-container"
         id="order-confirmation"
         style="display:none;">

    <h2>Confirm Your Order ♡</h2>

    <div id="order-summary"></div>

    <button class="pink-button" onclick="placeOrder()">
        Place Order ♡
    </button>

</section>
<!-- BACKGROUND MUSIC -->
<audio id="backgroundMusic" loop>
    <source src="audio/audio.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()" class="music-button">
    🎵 Play / Pause
</button>

<script>
function toggleMusic() {
    const music = document.getElementById("backgroundMusic");

    if (music.paused) {
        music.play();
    } else {
        music.pause();
    }
}
</script>
<!-- FOOTER -->
<footer>
    <h3>♡ Bobo's Chocolate World ♡</h3>
    <p>Sweetness in Every Bite!</p>
    <p class="copyright">© 2026 Bobo's Chocolate World</p>
</footer>
<form onsubmit="submitOrder(event)"></form>


<script src="zulaikhascript.js"></script>

</body>
</html>
